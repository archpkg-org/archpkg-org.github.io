<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore projects and resources from Archpkg.">
    <title>Archpkg</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18212f;
        background: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 8vw, 4rem);
        border: 1px solid #e1e7f0;
        border-radius: 1.25rem;
        background: #fff;
        box-shadow: 0 1.5rem 4rem rgb(24 33 47 / 8%);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #4567bd;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .intro {
        margin: 1.5rem 0 2rem;
        color: #536176;
        font-size: clamp(1.05rem, 3vw, 1.25rem);
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.8rem 1.1rem;
        border-radius: 0.6rem;
        background: #3459b5;
        color: #fff;
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        background: #284895;
      }

      a:focus-visible {
        outline: 3px solid #91aaf0;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Open source projects</p>
      <h1>Archpkg</h1>
      <p class="intro">Explore the projects, tools, and resources from Archpkg.</p>
      <a href="https://github.com/archpkg-org">Visit us on GitHub <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
